<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metis — Sign in</title>
<link rel="icon" href="assets/logo-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <img src="assets/logo-full.png" alt="Metis — Imagination for a better life" class="auth-logo-full">
    <p class="auth-subtitle">Explainable metabolic digital twin</p>

    <div class="auth-toggle">
      <button class="auth-toggle-btn active" id="showLoginBtn">Log in</button>
      <button class="auth-toggle-btn" id="showRegisterBtn">Register</button>
    </div>

    <form id="loginForm" class="auth-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" required>
      </div>
      <div class="auth-error" id="loginError"></div>
      <button type="submit" class="btn btn-primary auth-submit">Log in</button>
    </form>

    <form id="registerForm" class="auth-form hidden">
      <div class="field">
        <label>Email</label>
        <input type="email" id="registerEmail" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="registerPassword" required minlength="6">
        <p class="hint" style="margin-top:4px;">At least 6 characters.</p>
      </div>
      <div class="auth-error" id="registerError"></div>
      <button type="submit" class="btn btn-primary auth-submit">Create account &amp; continue</button>
    </form>

    <p class="auth-footnote">
      Accounts are stored locally in this app's own database — not shared with any third party.
    </p>
  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
